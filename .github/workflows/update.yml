name: Auto-update Solana report

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate report
        run: python3 solana_pulse.py
      - name: Commit refreshed report
        run: |
          git config user.name "solanapulse-bot"
          git config user.email "actions@github.com"
          git add dashboard.html report.md report.json
          git diff --cached --quiet || git commit -m "auto-update report $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
